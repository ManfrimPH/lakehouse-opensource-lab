name: lakehouse-opensource-lab

services:
  # ============================================================================
  # CAMADA 0: OBJECT STORAGE S3 (MinIO)
  # ============================================================================
  minio:
    image: pgsty/minio:latest
    container_name: lakehouse_minio
    hostname: minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DOMAIN: minio
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    networks:
      lakehouse_net:
        aliases:
          - minio
          - lakehouse.minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:latest
    container_name: lakehouse_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/lakehouse;
      mc mb --ignore-existing local/dremio;
      mc mb --ignore-existing local/backups;
      mc anonymous set public local/lakehouse;
      echo 'Buckets S3 (lakehouse, dremio, backups) criados com sucesso!';
      exit 0;
      "
    networks:
      - lakehouse_net

  # ============================================================================
  # CAMADA 1 & 2: CATÁLOGO GIT PARA DADOS & APACHE ICEBERG (Project Nessie)
  # ============================================================================
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: lakehouse_nessie
    hostname: nessie
    environment:
      QUARKUS_PROFILE: prod
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
    ports:
      - "${NESSIE_PORT:-19120}:19120"
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/19120 && echo -e 'GET /api/v1/config HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'defaultBranch' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ============================================================================
  # CAMADA 4: MOTOR COLUNAR VETORIZADO & CAMADA SEMÂNTICA (Dremio + Arrow)
  # ============================================================================
  dremio:
    image: dremio/dremio-oss:latest
    container_name: lakehouse_dremio
    hostname: dremio
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
    environment:
      DREMIO_MAX_HEAP_MEMORY_SIZE_MB: 2048
      DREMIO_MAX_DIRECT_MEMORY_SIZE_MB: 2048
      DREMIO_JAVA_SERVER_EXTRA_OPTS: "-Ddremio.classpath.scanning.annotation.descriptions.urls=true"
    ports:
      - "${DREMIO_HTTP_PORT:-9047}:9047"
      - "${DREMIO_ODBC_PORT:-31010}:31010"
      - "${DREMIO_FLIGHT_PORT:-32010}:32010"
    volumes:
      - dremio_data:/opt/dremio/data
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9047/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
    restart: unless-stopped

  # ============================================================================
  # INFRAESTRUTURA DE METADADOS & CACHE (PostgreSQL + Redis)
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: lakehouse_postgres
    hostname: postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse123}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse_meta}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d ${POSTGRES_DB:-lakehouse_meta}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lakehouse_redis
    hostname: redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # CAMADA 5: VISUALIZAÇÃO DEMOCRÁTICA SEM CUSTO POR ASSENTO (Apache Superset)
  # ============================================================================
  superset:
    image: apache/superset:3.1.1
    container_name: lakehouse_superset
    hostname: superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-lakehouse_opensource_superset_secret_key_2026}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      FLASK_ENV: production
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./scripts/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./scripts/init_superset.sh:/app/init_superset.sh:ro
    command: ["/bin/bash", "/app/init_superset.sh"]
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ============================================================================
  # CAMADA 6 (TRANSVERSAL): O MAESTRO DO DATA CI/CD (Apache Airflow + dbt-core)
  # ============================================================================
  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: lakehouse_airflow
    hostname: airflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse123}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.7.13 dbt-postgres==1.7.13 dbt-dremio==1.7.0 redis requests"
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./dbt_lakehouse:/opt/airflow/dbt_lakehouse
      - ./scripts:/opt/airflow/scripts
    command: standalone
    networks:
      - lakehouse_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
    restart: unless-stopped

networks:
  lakehouse_net:
    name: lakehouse_net
    driver: bridge

volumes:
  minio_data:
  dremio_data:
  postgres_data:
